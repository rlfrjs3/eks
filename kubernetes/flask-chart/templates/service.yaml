apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.service.name }}
  labels:
    app: flask

spec:
  selector:
    app: flask

  ports:
    - name: {{ .Values.service.portName }}
      port: {{ .Values.service.port }}
      protocol: TCP
      targetPort: {{ .Values.containerPort }}

  type: {{ .Values.service.type }}
