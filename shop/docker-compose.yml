services:

  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: shoppingmall-web

    ports:
      - "8080:80"

    environment:
      DB_HOST: mysql
      DB_NAME: shoppingmall
      DB_USER: shoppinguser
      DB_PASSWORD: shoppingpass

    depends_on:
      mysql:
        condition: service_healthy

    restart: unless-stopped


  mysql:
    image: mysql:8.0

    container_name: shoppingmall-mysql

    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: shoppingmall
      MYSQL_USER: shoppinguser
      MYSQL_PASSWORD: shoppingpass

    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-prootpass"
        ]

      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


volumes:
  mysql-data:
