name: EKS 부트스트랩 설치 (ArgoCD + GitOps Application)


#언제 작동할 것인가? -> 깃헙 사이트에서 [배포 버튼]을 누르면
on:
  workflow_dispatch:

#Github Actions가 Git에 push 할 수 있도록 권한 부여
permissions:
  contents: write

env:
  EKS_CLUSTER_NAME: ekseks-project-eks

jobs: 
  bootstrap:
    #runs-on: ubuntu-latest
    runs-on: self-hosted

    defaults:
      run:
        working-directory: terraform

    steps:
    - name: 1. 깃헙 테라폼 레포에 있는 코드를 러너VM에 다운로드 
      uses: actions/checkout@v4

    - name: 2. AWS profile 인증 
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_GEON }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_GEON }}
        aws-region: ap-northeast-2

    - name: 3. 러너VM에 테라폼 설치
      uses: hashicorp/setup-terraform@v3

    - name: 4. 테라폼 초기화 (init)
      run: | 
        terraform init
 
    - name: 5. EKS 연결
      run: | 
        aws eks update-kubeconfig --region ap-northeast-2 --name ${EKS_CLUSTER_NAME}
        kubectl get nodes
 
    - name: 6. ArgoCD 설치
      run: | 
        kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -         #전용 네임스페이스 생성
        kubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml  #설치
        kubectl wait --for=condition=Available deployment/argocd-server -n argocd --timeout=300s   #설치완료까지 대기

    - name: 7. AWS LB Controller 설정값 변경 (변경될 수 있는 vpc ID와 IAM Role만 변경)
      run: | 
        VPC_ID=$(terraform output -raw vpc_id)
        LB_ROLE_ARN=$(terraform output -raw aws_lb_controller_role_arn)

        sed -i "s|^vpcId: .*|vpcId: ${VPC_ID}|" ../kubernetes/values/aws-load-balancer-controller.yaml
        sed -i "s|^    eks.amazonaws.com/role-arn: .*|    eks.amazonaws.com/role-arn: ${LB_ROLE_ARN}|" ../kubernetes/values/aws-load-balancer-controller.yaml
         
    - name: 8. 최종 - Git 수정된 파일 Push
      run: | 
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add ../kubernetes/values/aws-load-balancer-controller.yaml 
        git diff --cached --quiet || git commit -m "Init bootstrap values push"
        git pull --rebase origin main
        git push origin HEAD:main
 
    - name: 9. ArgoCD + Git 연동 (부트스트랩 설치)
      run: | 
        kubectl apply -f ../kubernetes/bootstrap/root-app.yaml
